<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7490" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="كلام" />
    <title>كلام — Kalam</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // if the app's script file is missing, reload once instead of staying on a blank screen
      addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('kalam-reloaded')) {
          sessionStorage.setItem('kalam-reloaded', '1');
          location.reload();
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
